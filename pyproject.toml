[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "subsurface-uq"
version = "0.1.0"
description = "Modular uncertainty-quantification framework for subsurface heat-plume surrogate models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "torch>=2.1",
    "PyYAML>=6.0",
    "scipy>=1.10",
    "tqdm>=4.65",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
test = ["pytest>=7.4"]

[project.scripts]
subsurface-uq-release25 = "subsurface_uq.experiments.release25_empirical:main"
subsurface-uq-validate-temperature = "subsurface_uq.validation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
